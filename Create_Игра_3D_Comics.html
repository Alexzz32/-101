<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fallen Aces Style: Comic Shooter</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0e6d2; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        
        /* UI Styles - Comic Book Look */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .comic-panel {
            border: 4px solid #000;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            margin: 10px;
            box-shadow: 5px 5px 0px #000;
            font-weight: bold;
            text-transform: uppercase;
            pointer-events: auto;
        }

        #stats-bar {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .bar-container {
            width: 200px;
            height: 20px;
            border: 3px solid #000;
            background: #fff;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.2s;
        }

        #hp-bar { background: #d32f2f; }
        #xp-bar { background: #fbc02d; }

        .label {
            position: absolute;
            top: -25px;
            left: 0;
            color: #000;
            font-size: 14px;
            font-weight: 900;
            text-shadow: 1px 1px 0 #fff;
        }

        #wave-info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            text-align: center;
            background: #000;
            color: #fff;
            padding: 5px 20px;
            clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
        }

        #upgrade-menu {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #f0e6d2;
            border: 5px solid #000;
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }

        h2 { margin: 0 0 10px 0; text-align: center; font-style: italic; }

        .upgrade-btn {
            background: #fff;
            border: 3px solid #000;
            padding: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: transform 0.1s;
            box-shadow: 3px 3px 0 #000;
        }

        .upgrade-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 #000; }
        .upgrade-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            pointer-events: auto;
            z-index: 100;
        }

        .comic-title {
            font-size: 60px;
            color: #fbc02d;
            text-shadow: 4px 4px 0 #000;
            margin-bottom: 20px;
            font-style: italic;
            text-align: center;
            line-height: 1;
        }

        .action-btn {
            font-size: 24px;
            padding: 15px 40px;
            background: #d32f2f;
            color: #fff;
            border: 4px solid #000;
            cursor: pointer;
            box-shadow: 6px 6px 0 #000;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .action-btn:hover { background: #b71c1c; transform: scale(1.05); }

        /* Mobile Controls */
        #mobile-controls {
            display: none;
            pointer-events: auto;
            position: absolute;
            bottom: 20px;
            width: 100%;
            height: 150px;
        }
        
        @media (hover: none) and (pointer: coarse) {
            #mobile-controls { display: block; }
            #ui-layer .desktop-only { display: none; }
        }

        #joystick-zone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.2);
            border: 2px dashed #000;
            border-radius: 50%;
        }

        #joystick-knob {
            position: absolute;
            top: 50%; left: 50%;
            width: 40px; height: 40px;
            background: #000;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        #fire-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            background: #d32f2f;
            border: 4px solid #000;
            border-radius: 50%;
            box-shadow: 4px 4px 0 #000;
        }
        
        #fire-btn:active { background: #b71c1c; transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }

        .damage-flash {
            animation: flashRed 0.2s;
        }

        @keyframes flashRed {
            0% { box-shadow: inset 0 0 0 0 transparent; }
            50% { box-shadow: inset 0 0 50px 20px rgba(200, 0, 0, 0.5); }
            100% { box-shadow: inset 0 0 0 0 transparent; }
        }
    </style>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- PointerLockControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <!-- EffectComposer & Shaders for Comic Style -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    
    <!-- Custom Outline Shader for Cel Shading -->
    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec3 vNormal;
        void main() {
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>
    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform vec3 color;
        uniform float threshold;
        varying vec3 vNormal;
        void main() {
            float intensity = 1.0 - dot(vNormal, vec3(0.0, 0.0, 1.0));
            if (intensity > threshold) {
                gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); // Black outline
            } else {
                gl_FragColor = vec4(color, 1.0);
            }
        }
    </script>
</head>
<body>

<div id="ui-layer">
    <div id="wave-info">WAVE 1</div>
    
    <div class="comic-panel" id="stats-bar">
        <div style="position:relative;">
            <span class="label">HEALTH</span>
            <div class="bar-container"><div id="hp-bar" class="bar-fill"></div></div>
        </div>
        <div style="position:relative;">
            <span class="label">LEVEL <span id="level-val">1</span></span>
            <div class="bar-container"><div id="xp-bar" class="bar-fill" style="width: 0%"></div></div>
        </div>
        <div style="margin-left: auto; text-align: right;">
            <div>SCORE: <span id="score-val">0</span></div>
            <div style="font-size: 12px;">KILLS: <span id="kills-val">0</span></div>
        </div>
    </div>

    <div id="mobile-controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="fire-btn"></div>
    </div>
</div>

<div id="upgrade-menu" class="comic-panel">
    <h2>LEVEL UP!</h2>
    <div id="upgrades-list"></div>
</div>

<div id="start-screen">
    <div class="comic-title">PAPER<br>ACES</div>
    <p style="max-width: 600px; text-align: center; margin-bottom: 30px; font-size: 18px; line-height: 1.5; background: #fff; color: #000; padding: 10px; border: 2px solid #000;">
        Добро пожаловать в мир бумажного нуара!<br>
        Ты - детектив в городе из картона.<br>
        WASD - Движение | ЛКМ - Стрельба | Пробел - Рывок
    </p>
    <button class="action-btn" onclick="startGame()">START CASE</button>
</div>

<div id="game-over-screen" style="display: none;">
    <div class="comic-title" style="color: #d32f2f;">GAME OVER</div>
    <p style="font-size: 24px; margin-bottom: 20px;">FINAL SCORE: <span id="final-score">0</span></p>
    <button class="action-btn" onclick="resetGame()">TRY AGAIN</button>
</div>

<script>
/**
 * GAME CONFIGURATION & STATE
 */
const CONFIG = {
    colors: {
        bg: 0xf0e6d2, // Paper color
        ground: 0xe0d6c0,
        outline: 0x000000,
        player: 0x333333,
        blood: 0xd32f2f,
        xp: 0xfbc02d
    },
    player: { speed: 10, hp: 100, damage: 25, fireRate: 0.15 },
    enemies: {
        basic: { hp: 40, speed: 4, dmg: 10, color: 0x555555, size: 1.8 },
        tank: { hp: 120, speed: 2, dmg: 25, color: 0x333333, size: 2.5 },
        fast: { hp: 25, speed: 7, dmg: 5, color: 0x777777, size: 1.5 }
    }
};

let state = {
    isPlaying: false,
    score: 0,
    kills: 0,
    wave: 1,
    hp: 100,
    maxHp: 100,
    xp: 0,
    level: 1,
    nextLevelXp: 100,
    lastShot: 0,
    enemies: [],
    particles: [],
    projectiles: [],
    pickups: []
};

// Audio Context
let audioCtx;
let bgmOscillators = [];
let isMuted = false;

/**
 * THREE.JS SETUP
 */
const scene = new THREE.Scene();
scene.background = new THREE.Color(CONFIG.colors.bg);
scene.fog = new THREE.Fog(CONFIG.colors.bg, 10, 50);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: false }); // False for retro feel
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Post Processing (Comic Style)
const composer = new THREE.EffectComposer(renderer);
const renderPass = new THREE.RenderPass(scene, camera);
composer.addPass(renderPass);

// Bloom for dramatic effect
const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
bloomPass.threshold = 0.8;
bloomPass.strength = 0.4;
bloomPass.radius = 0.5;
composer.addPass(bloomPass);

// Lighting (Noir Style)
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffeebb, 0.8);
dirLight.position.set(20, 50, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 100;
dirLight.shadow.camera.left = -30;
dirLight.shadow.camera.right = 30;
dirLight.shadow.camera.top = 30;
dirLight.shadow.camera.bottom = -30;
scene.add(dirLight);

// Spotlights for drama
const spotLight = new THREE.SpotLight(0xffffff, 0.5);
spotLight.position.set(0, 30, 0);
spotLight.angle = Math.PI / 4;
spotLight.penumbra = 0.5;
scene.add(spotLight);

/**
 * TEXTURE GENERATORS (Procedural Comics)
 */
function createPaperTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#f0e6d2';
    ctx.fillRect(0, 0, 512, 512);
    
    // Noise
    for(let i=0; i<5000; i++) {
        ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.05})`;
        ctx.fillRect(Math.random()*512, Math.random()*512, 2, 2);
    }
    
    // Halftone dots
    for(let y=0; y<512; y+=10) {
        for(let x=0; x<512; x+=10) {
            ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.1})`;
            ctx.beginPath();
            ctx.arc(x+5, y+5, Math.random()*2, 0, Math.PI*2);
            ctx.fill();
        }
    }
    
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
}

function createEnemySprite(type) {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    
    // Body shape based on type
    ctx.fillStyle = '#333';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 8;
    
    if (type === 'tank') {
        // Big blocky guy
        ctx.fillRect(60, 150, 136, 250);
        ctx.strokeRect(60, 150, 136, 250);
        // Head
        ctx.fillRect(80, 50, 96, 90);
        ctx.strokeRect(80, 50, 96, 90);
        // Eyes
        ctx.fillStyle = '#fff';
        ctx.fillRect(90, 70, 30, 20);
        ctx.fillRect(136, 70, 30, 20);
        ctx.fillStyle = '#000';
        ctx.fillRect(100, 75, 10, 10);
        ctx.fillRect(146, 75, 10, 10);
    } else if (type === 'fast') {
        // Skinny guy
        ctx.fillRect(90, 180, 76, 200);
        ctx.strokeRect(90, 180, 76, 200);
        // Head
        ctx.beginPath();
        ctx.arc(128, 80, 40, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
        // Crazy eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(110, 70, 15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(146, 70, 15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#000';
        ctx.fillRect(105, 65, 10, 10);
        ctx.fillRect(141, 65, 10, 10);
    } else {
        // Standard thug
        ctx.fillRect(80, 160, 96, 220);
        ctx.strokeRect(80, 160, 96, 220);
        // Head
        ctx.fillRect(90, 60, 76, 80);
        ctx.strokeRect(90, 60, 76, 80);
        // Fedora hat
        ctx.fillStyle = '#000';
        ctx.fillRect(80, 60, 96, 20);
        ctx.fillRect(70, 70, 116, 10);
        // Eyes
        ctx.fillStyle = '#fff';
        ctx.fillRect(100, 80, 20, 15);
        ctx.fillRect(136, 80, 20, 15);
        ctx.fillStyle = '#000';
        ctx.fillRect(105, 85, 10, 5);
        ctx.fillRect(141, 85, 10, 5);
    }
    
    // Arms
    ctx.fillStyle = '#333';
    ctx.strokeStyle = '#000';
    ctx.fillRect(60, 180, 20, 100); ctx.strokeRect(60, 180, 20, 100);
    ctx.fillRect(176, 180, 20, 100); ctx.strokeRect(176, 180, 20, 100);
    
    // Legs
    ctx.fillRect(90, 380, 30, 100); ctx.strokeRect(90, 380, 30, 100);
    ctx.fillRect(136, 380, 30, 100); ctx.strokeRect(136, 380, 30, 100);

    const tex = new THREE.CanvasTexture(canvas);
    tex.magFilter = THREE.NearestFilter; // Pixelated look
    return tex;
}

function createTreeSprite() {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    
    // Trunk
    ctx.fillStyle = '#5d4037';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 5;
    ctx.fillRect(100, 300, 56, 200);
    ctx.strokeRect(100, 300, 56, 200);
    
    // Leaves (Comic cloud shape)
    ctx.fillStyle = '#2e7d32';
    ctx.beginPath();
    ctx.arc(128, 150, 100, 0, Math.PI*2);
    ctx.arc(60, 200, 80, 0, Math.PI*2);
    ctx.arc(196, 200, 80, 0, Math.PI*2);
    ctx.arc(128, 80, 90, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();
    
    // Details
    ctx.fillStyle = '#1b5e20';
    ctx.beginPath();
    ctx.arc(100, 150, 20, 0, Math.PI*2);
    ctx.arc(150, 120, 25, 0, Math.PI*2);
    ctx.fill();

    const tex = new THREE.CanvasTexture(canvas);
    tex.magFilter = THREE.NearestFilter;
    return tex;
}

function createBuildingSprite() {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#555';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 6;
    
    // Main structure
    ctx.fillRect(20, 50, 216, 450);
    ctx.strokeRect(20, 50, 216, 450);
    
    // Windows (Grid)
    ctx.fillStyle = '#000';
    for(let y=80; y<450; y+=60) {
        for(let x=40; x<200; x+=50) {
            ctx.fillRect(x, y, 30, 40);
            // Cross bar
            ctx.beginPath();
            ctx.moveTo(x, y); ctx.lineTo(x+30, y+40);
            ctx.moveTo(x+30, y); ctx.lineTo(x, y+40);
            ctx.stroke();
        }
    }
    
    // Roof detail
    ctx.fillStyle = '#333';
    ctx.fillRect(10, 40, 236, 20);
    ctx.strokeRect(10, 40, 236, 20);

    const tex = new THREE.CanvasTexture(canvas);
    tex.magFilter = THREE.NearestFilter;
    return tex;
}

/**
 * WORLD GENERATION
 */
const paperMat = new THREE.MeshStandardMaterial({ map: createPaperTexture(), roughness: 0.8 });
const groundGeo = new THREE.PlaneGeometry(200, 200);
const ground = new THREE.Mesh(groundGeo, paperMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grid helper for comic effect
const gridHelper = new THREE.GridHelper(200, 20, 0x000000, 0x000000);
gridHelper.position.y = 0.01;
gridHelper.material.opacity = 0.1;
gridHelper.material.transparent = true;
scene.add(gridHelper);

// Decorations (2D Sprites in 3D)
const treeMat = new THREE.SpriteMaterial({ map: createTreeSprite() });
const buildMat = new THREE.SpriteMaterial({ map: createBuildingSprite() });

function spawnDecoration() {
    for(let i=0; i<15; i++) {
        const sprite = new THREE.Sprite(treeMat);
        const angle = Math.random() * Math.PI * 2;
        const radius = 20 + Math.random() * 60;
        sprite.position.set(Math.cos(angle)*radius, 2.5, Math.sin(angle)*radius);
        sprite.scale.set(8, 16, 1);
        scene.add(sprite);
    }
    
    for(let i=0; i<8; i++) {
        const sprite = new THREE.Sprite(buildMat);
        const angle = Math.random() * Math.PI * 2;
        const radius = 40 + Math.random() * 40;
        sprite.position.set(Math.cos(angle)*radius, 4, Math.sin(angle)*radius);
        sprite.scale.set(15, 20, 1);
        scene.add(sprite);
    }
}
spawnDecoration();

/**
 * PLAYER SETUP
 */
const controls = new THREE.PointerLockControls(camera, document.body);
const playerObj = new THREE.Group();
playerObj.add(camera);
playerObj.position.y = 1.6;
scene.add(playerObj);

// Weapon Model (Simple Comic Gun)
const gunGeo = new THREE.BoxGeometry(0.15, 0.15, 0.6);
const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
const gun = new THREE.Mesh(gunGeo, gunMat);
gun.position.set(0.2, -0.2, -0.4);
camera.add(gun);

// Muzzle Flash Light
const muzzleLight = new THREE.PointLight(0xffaa00, 0, 5);
muzzleLight.position.set(0, 0, -0.6);
gun.add(muzzleLight);

/**
 * INPUT HANDLING
 */
const keys = { w: false, a: false, s: false, d: false, space: false };
const moveVec = new THREE.Vector3();
const clock = new THREE.Clock();

document.addEventListener('keydown', (e) => {
    if(e.code === 'KeyW') keys.w = true;
    if(e.code === 'KeyA') keys.a = true;
    if(e.code === 'KeyS') keys.s = true;
    if(e.code === 'KeyD') keys.d = true;
    if(e.code === 'Space') keys.space = true;
    if(e.code === 'MouseLeft' && state.isPlaying) shoot();
});

document.addEventListener('keyup', (e) => {
    if(e.code === 'KeyW') keys.w = false;
    if(e.code === 'KeyA') keys.a = false;
    if(e.code === 'KeyS') keys.s = false;
    if(e.code === 'KeyD') keys.d = false;
    if(e.code === 'Space') keys.space = false;
});

document.addEventListener('mousedown', () => {
    if(state.isPlaying && !controls.isLocked) controls.lock();
    if(state.isPlaying) shoot();
});

// Mobile Joystick
const joystickZone = document.getElementById('joystick-zone');
const joystickKnob = document.getElementById('joystick-knob');
let touchStartX = 0, touchStartY = 0;
let moveInput = { x: 0, y: 0 };

joystickZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.changedTouches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
}, {passive: false});

joystickZone.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touch = e.changedTouches[0];
    let dx = touch.clientX - touchStartX;
    let dy = touch.clientY - touchStartY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const maxDist = 40;
    if(dist > maxDist) {
        dx = (dx/dist) * maxDist;
        dy = (dy/dist) * maxDist;
    }
    joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    moveInput.x = dx / maxDist;
    moveInput.y = dy / maxDist;
}, {passive: false});

joystickZone.addEventListener('touchend', (e) => {
    e.preventDefault();
    joystickKnob.style.transform = `translate(-50%, -50%)`;
    moveInput.x = 0;
    moveInput.y = 0;
});

document.getElementById('fire-btn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    if(state.isPlaying) shoot();
});

/**
 * GAME LOGIC
 */
function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over-screen').style.display = 'none';
    state.isPlaying = true;
    state.hp = 100;
    state.score = 0;
    state.kills = 0;
    state.wave = 1;
    state.xp = 0;
    state.level = 1;
    state.nextLevelXp = 100;
    state.enemies.forEach(e => scene.remove(e.mesh));
    state.enemies = [];
    playerObj.position.set(0, 1.6, 0);
    
    initAudio();
    startBackgroundMusic();
    startNewWave();
    updateUI();
    controls.lock();
}

function resetGame() {
    startGame();
}

function gameOverFunc() {
    state.isPlaying = false;
    controls.unlock();
    document.getElementById('final-score').innerText = state.score;
    document.getElementById('game-over-screen').style.display = 'flex';
    stopBackgroundMusic();
}

function startNewWave() {
    document.getElementById('wave-info').innerText = `WAVE ${state.wave}`;
    const count = 5 + state.wave * 3;
    for(let i=0; i<count; i++) {
        setTimeout(() => {
            if(!state.isPlaying) return;
            createEnemy();
        }, i * 500);
    }
}

function createEnemy() {
    if(state.enemies.length > 20) return;
    
    const rand = Math.random();
    let type = 'basic';
    if(rand > 0.8) type = 'tank';
    else if(rand > 0.6) type = 'fast';
    
    const data = CONFIG.enemies[type];
    const spriteMat = new THREE.SpriteMaterial({ map: createEnemySprite(type) });
    const mesh = new THREE.Sprite(spriteMat);
    
    // Spawn random pos away from player
    const angle = Math.random() * Math.PI * 2;
    const dist = 20 + Math.random() * 20;
    mesh.position.set(
        playerObj.position.x + Math.cos(angle) * dist,
        1.5,
        playerObj.position.z + Math.sin(angle) * dist
    );
    
    mesh.scale.set(data.size, data.size * 2, 1);
    scene.add(mesh);
    
    state.enemies.push({
        mesh: mesh,
        type: type,
        hp: data.hp + (state.wave * 5),
        speed: data.speed,
        dmg: data.dmg,
        lastAttack: 0
    });
}

function shoot() {
    const now = Date.now();
    if(now - state.lastShot < CONFIG.player.fireRate * 1000) return;
    state.lastShot = now;
    
    playSound('shoot');
    
    // Recoil
    gun.position.z += 0.2;
    muzzleLight.intensity = 2;
    setTimeout(() => { muzzleLight.intensity = 0; }, 50);
    
    // Raycast
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    
    const intersects = raycaster.intersectObjects(state.enemies.map(e => e.mesh));
    
    if(intersects.length > 0) {
        const hit = intersects[0];
        const enemyIdx = state.enemies.findIndex(e => e.mesh === hit.object);
        if(enemyIdx !== -1) {
            const enemy = state.enemies[enemyIdx];
            enemy.hp -= CONFIG.player.damage;
            
            // Hit effect
            createParticle(hit.point, CONFIG.colors.blood, 5);
            playSound('hit');
            
            if(enemy.hp <= 0) {
                killEnemy(enemyIdx);
            }
        }
    }
    
    // Projectile visual
    createProjectile();
}

function createProjectile() {
    const geo = new THREE.SphereGeometry(0.05, 4, 4);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(gun.getWorldPosition(new THREE.Vector3()));
    
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    
    state.projectiles.push({ mesh, dir, life: 0.5 });
    scene.add(mesh);
}

function killEnemy(idx) {
    const enemy = state.enemies[idx];
    createParticle(enemy.mesh.position, CONFIG.colors.blood, 15);
    playSound('kill');
    
    scene.remove(enemy.mesh);
    state.enemies.splice(idx, 1);
    
    state.kills++;
    state.score += (enemy.type === 'tank' ? 30 : enemy.type === 'fast' ? 20 : 10);
    addXp(enemy.type === 'tank' ? 30 : 10);
    
    if(state.enemies.length === 0) {
        state.wave++;
        setTimeout(startNewWave, 2000);
    }
    updateUI();
}

function createParticle(pos, color, count) {
    for(let i=0; i<count; i++) {
        const geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
        const mat = new THREE.MeshBasicMaterial({ color: color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pos);
        mesh.position.x += (Math.random()-0.5)*0.5;
        mesh.position.y += (Math.random()-0.5)*0.5;
        mesh.position.z += (Math.random()-0.5)*0.5;
        
        const vel = new THREE.Vector3(
            (Math.random()-0.5)*5,
            (Math.random())*5,
            (Math.random()-0.5)*5
        );
        
        state.particles.push({ mesh, vel, life: 1.0 });
        scene.add(mesh);
    }
}

function addXp(amount) {
    state.xp += amount;
    if(state.xp >= state.nextLevelXp) {
        state.xp -= state.nextLevelXp;
        state.level++;
        state.nextLevelXp = Math.floor(state.nextLevelXp * 1.2);
        playSound('levelup');
        showUpgradeMenu();
    }
    updateUI();
}

function showUpgradeMenu() {
    state.isPlaying = false;
    controls.unlock();
    const menu = document.getElementById('upgrade-menu');
    const list = document.getElementById('upgrades-list');
    list.innerHTML = '';
    
    const upgrades = [
        { name: "Heavy Bullets", desc: "+Damage", apply: () => CONFIG.player.damage += 10 },
        { name: "Quick Draw", desc: "+Fire Rate", apply: () => CONFIG.player.fireRate *= 0.8 },
        { name: "Stimpack", desc: "+Max HP & Heal", apply: () => { CONFIG.player.maxHp += 20; state.hp = Math.min(state.hp+20, CONFIG.player.maxHp); } },
        { name: "Adrenaline", desc: "+Speed", apply: () => CONFIG.player.speed += 2 }
    ];
    
    upgrades.forEach(u => {
        const btn = document.createElement('button');
        btn.className = 'upgrade-btn';
        btn.innerHTML = `<div>${u.name}</div><div style="font-size:12px; font-weight:normal;">${u.desc}</div>`;
        btn.onclick = () => {
            u.apply();
            menu.style.display = 'none';
            state.isPlaying = true;
            controls.lock();
            updateUI();
        };
        list.appendChild(btn);
    });
    
    menu.style.display = 'flex';
}

function updateUI() {
    document.getElementById('hp-bar').style.width = `${(state.hp / CONFIG.player.maxHp) * 100}%`;
    document.getElementById('xp-bar').style.width = `${(state.xp / state.nextLevelXp) * 100}%`;
    document.getElementById('level-val').innerText = state.level;
    document.getElementById('score-val').innerText = state.score;
    document.getElementById('kills-val').innerText = state.kills;
}

/**
 * AUDIO SYSTEM (Synthesized)
 */
function initAudio() {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
    if(!audioCtx || isMuted) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    
    if(type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if(type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.linearRampToValueAtTime(50, now + 0.05);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
    } else if(type === 'kill') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if(type === 'levelup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.setValueAtTime(600, now + 0.1);
        osc.frequency.setValueAtTime(800, now + 0.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
    }
}

function startBackgroundMusic() {
    if(!audioCtx) return;
    stopBackgroundMusic();
    
    // Simple Noir Bassline
    const notes = [110, 110, 130, 110, 98, 98, 110, 130];
    let idx = 0;
    
    function playNote() {
        if(!state.isPlaying) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = notes[idx % notes.length];
        
        // Lowpass filter for muffled noir sound
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400;
        
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        
        const now = audioCtx.currentTime;
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        
        osc.start(now);
        osc.stop(now + 0.4);
        
        idx++;
        setTimeout(playNote, 500);
    }
    playNote();
}

function stopBackgroundMusic() {
    // Handled by stopping the recursive timeout via state.isPlaying check
}

/**
 * MAIN LOOP
 */
function animate() {
    requestAnimationFrame(animate);
    
    if(!state.isPlaying) {
        composer.render();
        return;
    }
    
    const dt = clock.getDelta();
    
    // Player Movement
    const speed = CONFIG.player.speed;
    moveVec.set(0,0,0);
    
    if(keys.w || moveInput.y < -0.1) moveVec.z -= 1;
    if(keys.s || moveInput.y > 0.1) moveVec.z += 1;
    if(keys.a || moveInput.x < -0.1) moveVec.x -= 1;
    if(keys.d || moveInput.x > 0.1) moveVec.x += 1;
    
    if(moveVec.length() > 0) {
        moveVec.normalize().multiplyScalar(speed * dt);
        playerObj.translateX(moveVec.x);
        playerObj.translateZ(moveVec.z);
        
        // Bobbing
        camera.position.y = 1.6 + Math.sin(Date.now() * 0.01) * 0.05;
    }
    
    // Boundary
    playerObj.position.x = Math.max(-90, Math.min(90, playerObj.position.x));
    playerObj.position.z = Math.max(-90, Math.min(90, playerObj.position.z));
    
    // Gun Recovery
    gun.position.z = THREE.MathUtils.lerp(gun.position.z, -0.4, dt * 10);
    
    // Enemies AI
    state.enemies.forEach(e => {
        e.mesh.lookAt(playerObj.position);
        const dist = e.mesh.position.distanceTo(playerObj.position);
        
        if(dist > 1.5) {
            e.mesh.translateZ(e.speed * dt);
        } else {
            // Attack
            const now = Date.now();
            if(now - e.lastAttack > 1000) {
                state.hp -= e.dmg;
                e.lastAttack = now;
                playSound('hit');
                document.getElementById('ui-layer').classList.add('damage-flash');
                setTimeout(()=>document.getElementById('ui-layer').classList.remove('damage-flash'), 200);
                updateUI();
                
                if(state.hp <= 0) gameOverFunc();
            }
        }
    });
    
    // Projectiles
    for(let i = state.projectiles.length-1; i>=0; i--) {
        const p = state.projectiles[i];
        p.life -= dt;
        p.mesh.position.addScaledVector(p.dir, 20 * dt);
        if(p.life <= 0) {
            scene.remove(p.mesh);
            state.projectiles.splice(i, 1);
        }
    }
    
    // Particles
    for(let i = state.particles.length-1; i>=0; i--) {
        const p = state.particles[i];
        p.life -= dt;
        p.vel.y -= 9.8 * dt; // Gravity
        p.mesh.position.addScaledVector(p.vel, dt);
        p.mesh.rotation.x += dt;
        p.mesh.scale.multiplyScalar(0.95);
        
        if(p.life <= 0 || p.mesh.position.y < 0) {
            scene.remove(p.mesh);
            state.particles.splice(i, 1);
        }
    }
    
    composer.render();
}

animate();

// Resize Handler
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
});

</script>
